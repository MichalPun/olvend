<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { width: 310px; margin: 0; padding: 18px; font: 14px/1.45 Arial,sans-serif; color: #17212b; background: #f7f9fc; }
    .brand { color: #d5101a; font-weight: 900; letter-spacing: .08em; }
    h1 { margin: 5px 0 14px; font-size: 18px; }
    .status { padding: 12px; border: 1px solid #dfe5ec; border-radius: 12px; background: #fff; }
    .status strong { display: block; margin-bottom: 3px; }
    .ok strong { color: #168451; } .error strong { color: #c62828; }
    button, a { display: flex; justify-content: center; width: 100%; box-sizing: border-box; margin-top: 10px; padding: 10px; border: 0; border-radius: 9px; font-weight: 800; text-decoration: none; cursor: pointer; }
    button { color: #fff; background: #d5101a; } a { color: #344054; background: #e9eef5; }
    small { display: block; margin-top: 10px; color: #667085; }
  </style>
</head>
<body>
  <div class="brand">OLVEND</div>
  <h1>T-Mobile Motion</h1>
  <div id="status" class="status"><strong>Kontroluji připojení…</strong><span></span></div>
  <button id="sync" type="button">Synchronizovat teď</button>
  <a href="https://olvend.onrender.com/dashboard.html" target="_blank">Otevřít nástěnku</a>
  <small>Přístupový token T-Mobile zůstává pouze v tomto prohlížeči. Do OLVENDU se odesílá jen stav a poloha vozidel.</small>
  <script src="popup.js"></script>
</body>
</html>
