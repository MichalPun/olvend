<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLVEND · Kontrolní protokol</title>
<style>
  :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.page{width:min(980px,100%);margin:auto;background:#fff;min-height:100vh;padding:30px}.toolbar{display:flex;gap:10px;justify-content:flex-end;position:sticky;top:0;background:rgba(255,255,255,.95);padding:10px 0;z-index:2}.toolbar button,.toolbar a{border:0;border-radius:10px;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer;background:#eef2f7;color:#172033}.toolbar .primary{background:#d71825;color:#fff}header{border-bottom:3px solid #d71825;padding:15px 0 22px;margin-bottom:22px}header small{color:#d71825;font-weight:900;letter-spacing:.08em}h1{font-size:32px;margin:7px 0}.meta{display:flex;gap:18px;flex-wrap:wrap;color:#667085}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.metric{background:#f5f7fa;border-radius:12px;padding:14px}.metric small,.metric strong{display:block}.metric small{color:#667085}.metric strong{font-size:24px;margin-top:4px}.stop{border:1px solid #dbe2ea;border-radius:16px;margin:16px 0;overflow:hidden}.stop-head{background:#f5f7fa;padding:15px}.stop-head h2{margin:0}.stop-body{padding:15px}.machine{border-top:1px solid #e6ebf1;padding:16px 0}.machine:first-child{border-top:0}.machine h3{margin:0 0 10px}.rows{display:grid;gap:6px}.row{display:grid;grid-template-columns:minmax(170px,1fr) 110px minmax(200px,2fr);gap:10px;padding:8px 10px;border-radius:8px;background:#f8fafc;font-size:13px}.ok{color:#187747}.finding{color:#b31926}.notice{padding:12px;border-radius:10px;background:#fff3d8;color:#7a5300;margin:8px 0}.photo{width:220px;max-width:100%;border-radius:10px;margin:10px 8px 0 0}.empty{padding:30px;text-align:center;color:#667085}.signature{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:45px}.signature div{border-top:1px solid #8a94a5;padding-top:7px;color:#667085;font-size:12px}@media(max-width:650px){.page{padding:16px}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.toolbar{position:static}}@media print{body{background:#fff}.page{width:100%;padding:0}.toolbar{display:none}.stop{break-inside:avoid}.machine{break-inside:avoid}}
</style></head><body><main class="page"><div class="toolbar"><a href="mobile-control.html">Zpět</a><button id="shareBtn">Sdílet</button><button class="primary" id="printBtn">Vytisknout / uložit PDF</button></div><div id="content"><div class="empty">Načítám kontrolní protokol…</div></div></main>
<script type="module">
import { supabase } from './supabase.js'
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])),fmt=v=>v?new Intl.DateTimeFormat('cs-CZ',{dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'–',routeId=Number(new URLSearchParams(location.search).get('route'))
const statusLabel={ok:'V pořádku',finding:'Nález',pending:'Nevyplněno',not_applicable:'Netýká se',completed:'Dokončeno',in_progress:'Probíhá',planned:'Naplánováno',skipped:'Přeskočeno'}
let protocol=null
function valueText(value){if(value==null)return'';if(typeof value==='object')return Object.entries(value).map(([k,v])=>`${k}: ${v??'–'}`).join(', ');return String(value)}
async function signedPhotos(photos){return Promise.all((photos||[]).map(async p=>{const {data}=await supabase.storage.from('control-evidence').createSignedUrl(p.storage_path,3600);return{...p,url:data?.signedUrl||''}}))}
function checksHtml(rows){if(!rows.length)return'<div class="empty">Bez uložených kontrolních bodů.</div>';return `<div class="rows">${rows.map(c=>`<div class="row"><strong>${esc(c.item_label)}</strong><b class="${c.status==='ok'?'ok':c.status==='finding'?'finding':''}">${esc(statusLabel[c.status]||c.status)}</b><span>${c.measured_value!=null?`${esc(c.measured_value)} ${esc(c.measure_unit||'')}`:esc(c.note||'')}</span></div>`).join('')}</div>`}
function render(){const p=protocol,r=p.route,stops=p.stops||[],machines=p.machines||[],checks=p.checks||[],findings=p.findings||[],adjustments=p.adjustments||[],requests=p.label_requests||[],photos=p.photos||[],handoffs=p.handoffs||[],done=machines.filter(m=>m.status==='completed').length,delegated=findings.filter(f=>f.task_id||f.technical_job_id).length+requests.length;$('#content').innerHTML=`<header><small>OLVEND · NÁVŠTĚVNÍ PROTOKOL</small><h1>${esc(r.name)}</h1><div class="meta"><span>${esc(r.planned_date)}</span><span>Kontrolu provedl: <strong>${esc(r.employee)}</strong></span><span>Dokončeno: ${fmt(r.completed_at)}</span></div></header><section class="summary"><div class="metric"><small>Místa</small><strong>${stops.length}</strong></div><div class="metric"><small>Automaty</small><strong>${done}/${machines.length}</strong></div><div class="metric"><small>Nálezy</small><strong>${findings.length}</strong></div><div class="metric"><small>Předané úkoly</small><strong>${delegated}</strong></div></section>${stops.map(stop=>{const sm=machines.filter(m=>String(m.stop_id)===String(stop.id)),placeChecks=checks.filter(c=>String(c.stop_id)===String(stop.id)&&!c.machine_id),sh=handoffs.filter(h=>String(h.stop_id)===String(stop.id));return `<section class="stop"><div class="stop-head"><h2>${stop.stop_order}. ${esc(stop.location_name)}</h2><div class="meta"><span>${esc([stop.address,stop.city].filter(Boolean).join(', '))}</span><span>${esc(statusLabel[stop.status]||stop.status)}</span><span>${fmt(stop.completed_at)}</span></div></div><div class="stop-body"><h3>Místo a okolí</h3>${checksHtml(placeChecks)}${sh.length?`<h3>Pokyny pro příští běžnou návštěvu</h3>${sh.map(h=>`<div class="notice"><strong>${esc(h.title)}</strong><br>${esc(h.message)}<br><small>Zadal: ${esc(h.created_by||'–')} · vzkaz #${esc(h.operator_message_id)}</small></div>`).join('')}`:''}${sm.map(m=>{const mc=checks.filter(c=>String(c.machine_id)===String(m.id)),mf=findings.filter(f=>String(f.machine_id)===String(m.id)),ma=adjustments.filter(a=>String(a.machine_id)===String(m.id)),mr=requests.filter(q=>String(q.machine_id)===String(m.id)),mp=photos.filter(x=>String(x.machine_id)===String(m.id));return `<div class="machine"><h3>EV ${esc(m.evidence_number)} · ${esc(m.machine_name)} <small>(${m.machine_kind==='coffee'?'kávový':'potravinový'})</small></h3>${checksHtml(mc)}${mf.map(f=>`<div class="notice"><strong>${esc(f.category)} · ${esc(f.severity)}</strong><br>${esc(f.description)} · ${esc(f.status)}${f.assigned_employee?`<br>Předáno: ${esc(f.assigned_employee)}${f.technical_job_id?` · servisní zásah #${f.technical_job_id}`:f.task_id?` · úkol #${f.task_id}`:''}`:''}</div>`).join('')}${ma.length?`<h4>Provedené změny</h4><div class="rows">${ma.map(a=>`<div class="row"><strong>${esc(a.adjustment_type)}</strong><span>${esc(valueText(a.before_value))}</span><span>→ ${esc(valueText(a.after_value))}${a.note?` · ${esc(a.note)}`:''}</span></div>`).join('')}</div>`:''}${mr.map(q=>`<div class="notice"><strong>${esc(q.request_code)}</strong> · ${esc((q.issue_types||[]).join(', '))}<br>Předáno: ${esc(q.assigned_employee||'neurčeno')}${q.technical_job_id?` · servisní zásah #${q.technical_job_id}`:q.task_id?` · úkol #${q.task_id}`:''}</div>`).join('')}${mp.map(x=>x.url?`<img class="photo" src="${esc(x.url)}" alt="Stav automatu při odjezdu">`:'').join('')}</div>`}).join('')}</div></section>`}).join('')}<div class="signature"><div>Kontrolu provedl</div><div>Převzal / seznámen</div></div>`}
async function load(){if(!Number.isFinite(routeId))throw new Error('Chybí číslo kontrolní trasy.');const {data,error}=await supabase.rpc('get_control_route_protocol_v59',{p_route_id:routeId});if(error)throw error;protocol={...data,photos:await signedPhotos(data.photos)};render()}
$('#printBtn').onclick=()=>window.print();$('#shareBtn').onclick=async()=>{const text=`Kontrolní protokol OLVEND: ${protocol?.route?.name||''}`;if(navigator.share)await navigator.share({title:'Kontrolní protokol OLVEND',text,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Odkaz na protokol byl zkopírován.')}}
load().catch(error=>{$('#content').innerHTML=`<div class="empty">Protokol se nepodařilo načíst: ${esc(error.message)}</div>`})
</script></body></html>
