<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OLVEND Operátor">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>OLVEND Operátor · Přihlášení</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;display:grid;place-items:center;padding:18px;color:#fff;background:#111820;font-family:Arial,Helvetica,sans-serif}.login{width:100%;max-width:420px}.logo{width:74px;height:74px;display:block;margin-bottom:22px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.3)}h1{margin:0;font-size:31px;line-height:1.05}h1 b{color:#e20d1a}p{margin:9px 0 22px;color:#b9c1cd;font-size:14px;line-height:1.45}.panel{padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:#1a232d;box-shadow:0 18px 50px rgba(0,0,0,.28)}label{display:block;margin:0 0 7px;color:#d5dae1;font-size:12px;font-weight:700}.field{margin-bottom:14px}input{width:100%;min-height:52px;padding:12px 13px;border:1px solid #3b4653;border-radius:11px;outline:0;color:#fff;background:#111820;font:inherit;font-size:16px}input:focus{border-color:#e20d1a;box-shadow:0 0 0 3px rgba(226,13,26,.18)}button{width:100%;min-height:54px;border:0;border-radius:11px;color:#fff;background:#d5101a;font:inherit;font-size:16px;font-weight:700}button:disabled{opacity:.65}.login-status{min-height:22px;margin:0 0 12px;color:#b9c1cd;font-size:12px;line-height:1.35}.login-status.error{color:#ffb4ba}.login-status.success{color:#8ee0b0}.secure{margin-top:14px;display:flex;align-items:center;gap:8px;color:#919cab;font-size:11px}.secure::before{content:'✓';width:21px;height:21px;display:grid;place-items:center;border-radius:50%;color:#8ee0b0;background:#21362e;font-weight:700}
  </style>
</head>
<body>
  <main class="login">
    <img class="logo" src="./icon-192.png" alt="OLVEND Operátor">
    <h1><b>OLVEND</b> Operátor</h1>
    <p>Přihlášení pro obsluhu vendingových automatů.</p>
    <section class="panel">
      <div id="statusLine" class="login-status">Načítám…</div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" inputmode="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Heslo</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button id="loginButton" type="submit">Přihlásit se</button>
      </form>
      <div class="secure">Přístup jen pro aktivní zaměstnance OLVEND</div>
    </section>
  </main>
  <script src="./operator-login.js"></script>
  <script src="./pwa.js"></script>
</body>
</html>
