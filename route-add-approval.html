<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OLVEND · Přidání automatu do trasy</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17212b;font-family:Arial,sans-serif}main{max-width:560px;margin:48px auto;padding:18px}.card{padding:28px;border:1px solid #dfe3e8;border-radius:24px;background:#fff;box-shadow:0 18px 44px rgba(16,24,40,.12)}.brand{font-weight:900;color:#d5101a}h1{margin:18px 0 10px;font-size:28px}.copy{color:#667085;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}button{min-height:52px;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer}.approve{border:0;color:#fff;background:#d5101a}.reject{border:1px solid #d0d5dd;color:#344054;background:#fff}.result{margin-top:18px;padding:13px;border-radius:13px;font-weight:800}.result:empty{display:none}.result.good{color:#067647;background:#ecfdf3}.result.bad{color:#b42318;background:#fef3f2}.note{margin-top:16px;color:#98a2b3;font-size:12px}@media(max-width:480px){main{margin:20px auto}.card{padding:22px}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main><section class="card"><div class="brand">OLVEND</div><h1 id="title">Přidání automatu do trasy</h1><p class="copy" id="copy">Potvrď, zda se má chybějící automat přidat do zbývající části dnešní trasy.</p><div class="actions"><button class="approve" type="button" data-decision="approve">Schválit přidání</button><button class="reject" type="button" data-decision="reject">Zamítnout</button></div><div class="result" id="result"></div><p class="note">Rozhodnutí je jednorázové. Po schválení se automat objeví operátorovi po obnovení trasy.</p></section></main>
  <script>
    const params=new URLSearchParams(location.search),token=params.get('token')||'',preferred=params.get('decision')||''
    const title=document.getElementById('title'),copy=document.getElementById('copy'),result=document.getElementById('result'),buttons=[...document.querySelectorAll('[data-decision]')]
    if(preferred==='reject'){title.textContent='Zamítnout přidání automatu';copy.textContent='Potvrď, že se automat do dnešní trasy nemá přidat.'}
    if(!token){result.className='result bad';result.textContent='Schvalovací odkaz je neplatný.';buttons.forEach(button=>button.disabled=true)}
    buttons.forEach(button=>button.addEventListener('click',async()=>{const decision=button.dataset.decision;buttons.forEach(item=>item.disabled=true);button.textContent='Ukládám rozhodnutí…';result.className='result';result.textContent='';try{const response=await fetch('https://rerjlkrhiytgscjerqgs.supabase.co/functions/v1/route-add-approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'decision',token,decision})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Rozhodnutí se nepodařilo uložit.');const approved=data.status==='approved',rejected=data.status==='rejected';title.textContent=approved?'Automat byl přidán do trasy':rejected?'Žádost byla zamítnuta':'Žádost už byla vyřízena';copy.textContent=approved?'Mobil operátora po obnovení načte novou zastávku a zařadí ji do zbývající trasy.':rejected?'Trasa zůstává beze změny.':`Aktuální stav: ${data.status||'vyřízeno'}.`;result.className='result good';result.textContent='Rozhodnutí je bezpečně uložené v OLVENDu.';document.querySelector('.actions').hidden=true;history.replaceState(null,'',location.pathname)}catch(error){result.className='result bad';result.textContent=error.message||'Rozhodnutí se nepodařilo uložit.';buttons.forEach(item=>item.disabled=false);button.textContent=decision==='approve'?'Schválit přidání':'Zamítnout'}}))
  </script>
</body>
</html>
