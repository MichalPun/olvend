function apiError(e){if(/not connected|Mailbox is not connected/i.test(e.message)){location.href='mail-settings.html';return}throw e}

async function loadAccount(){let lastError=null;for(let attempt=0;attempt<3;attempt++){try{const r=await mailApi('/account');account=r.account;if(account){$('accountLabel').textContent=`Připojeno · ${account.email_address}`;return true}}catch(e){lastError=e}if(attempt<2)await new Promise(resolve=>setTimeout(resolve,900*(attempt+1)))}if(lastError&&!/not connected|Mailbox is not connected/i.test(lastError.message))throw lastError;showSetupRequired();return false}
async function loadFolders(){try{const r=await mailApi('/folders');const list=r.folders||[];$('folders').innerHTML=list.map(f=>`<button class="folder ${f.path===folder?'active':''}" data-folder="${esc(f.path)}"><span>${f.special_use==='\\Sent'?'➤':f.special_use==='\\Drafts'?'▤':f.special_use==='\\Trash'?'⌫':f.path==='INBOX'?'✉':'□'}</span><span>${esc(f.name||f.path)}</span></button>`).join('');document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folder=b.dataset.folder;$('folderTitle').textContent=b.textContent.trim();loadFolders();loadMessages()})}catch(e){$('folders').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

async function loadMessages(){ $('messageList').innerHTML='<div class="empty">Načítám zprávy…</div>';try{const r=await mailApi(`/messages?folder=${encodeURIComponent(folder)}&limit=60`);messages=r.messages||[];renderMessages();if(folder.toUpperCase()==='INBOX')window.dispatchEvent(new CustomEvent('olvend-mail-unread-changed'))}catch(e){$('messageList').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function addressText(list){return(list||[]).map(x=>x.name?`${x.name} <${x.address}>`:x.address).join(', ')}
async function openMessage(uid){$('reading').innerHTML='<div class="empty">Načítám zprávu…</div>';try{const r=await mailApi(`/message?folder=${encodeURIComponent(folder)}&uid=${uid}`);selected=r.message;const listed=messages.find(message=>message.uid===uid);if(listed)listed.is_read=true;renderMessages();window.dispatchEvent(new CustomEvent('olvend-mail-unread-changed'));const html=selected.html||`<pre style="white-space:pre-wrap;font:14px Arial;line-height:1.55">${esc(selected.text)}</pre>`;$('reading').innerHTML=`<div class="reading-tools"><button class="icon" id="replyTop" title="Odpovědět">↩ Odpovědět</button><button class="icon danger" id="deleteTop" title="Přesunout do koše">🗑 Smazat</button></div><h2>${esc(selected.subject)}</h2><div class="sender"><div class="avatar">${esc((selected.from?.[0]?.name||selected.from?.[0]?.address||'?').slice(0,2).toUpperCase())}</div><div class="sender-info"><strong>${esc(addressText(selected.from))}</strong><span class="muted">pro ${esc(addressText(selected.to))}</span></div><span class="date">${fmt(selected.date)}</span></div><iframe class="body-frame" sandbox="allow-popups" referrerpolicy="no-referrer"></iframe><div class="attachments">${selected.attachments.map(a=>`<button class="attachment" data-attachment="${a.index}">📎 ${esc(a.filename)} · ${Math.round(a.size/1024)} kB</button>`).join('')}</div><div class="quick"><button class="btn primary" id="replyButton">Odpovědět</button><button class="btn">Vytvořit zásah</button><button class="btn">Vytvořit úkol</button></div>`;const frame=$('reading').querySelector('iframe');frame.srcdoc=`<!doctype html><meta charset="utf-8"><style>body{font:14px Arial;color:#17212b;line-height:1.6;margin:0}img{max-width:100%;height:auto}a{color:#b90f18}</style>${html}`;frame.onload=()=>{try{frame.style.height=`${Math.max(260,frame.contentDocument.body.scrollHeight+20)}px`}catch{}};$('replyButton').onclick=$('replyTop').onclick=()=>openComposer(true);$('deleteTop').onclick=()=>deleteMessage(uid);doc async function deleteMessage(uid){if(!confirm('Přesunout tuto zprávu do koše?'))return;const button=$('deleteTop');button.disabled=true;button.textContent='Přesouvám…';try{await mailApi(`/message?folder=${encodeURIComponent(folder)}&uid=${uid}`,{method:'DELETE'});messages=messages.filter(message=>message.uid!==uid);selected=null;renderMessages();$('reading').innerHTML='<div class="empty">Zpráva byla přesunuta do koše.</div>';window.dispatchEvent(new CustomEvent('olvend-mail-unread-changed'))}catch(e){button.disabled=false;button.textContent='🗑 Smazat';alert(e.message)}}

function openComposer(reply=false){attachments=[];$('composerFiles').innerHTML='';$('toInput').value=reply?selected?.from?.[0]?.address||'':'';$('ccInput').value='';$('subjectInput').value=reply&&selected?(/^re:/i.test(selected.subject)?selected.subject:`Re: ${selected.subject}`):'';$('mailEditor').innerHTML=reply?'<p>Dobrý den,</p><p><br></p>':'<p>Dobrý den,</p><p><br></p>';$('composerTitle').textContent=reply?'Odpověď':'Nová zpráva';$('composeOverlay').classList.add('show');applySignature()}

$('attachmentInput').onchange=async e=>{for(const file of e.target.files||[]){const content=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});attachments.push({filename:file.name,content_type:file.type,content})}$('composerFiles').innerHTML=attachments.map(a=>`<span class="file-chip">📎 ${esc(a.filename)}</span>`).join('')};$('attachmentButton').onclick=()=>$('attachmentInput').click();$('signatureSelect').onchange=applySignature;$('closeComposer').onclick=()=>$('composeOverlay').classList.remove('show');$('composeButton').onclick=()=>openComposer(false);$('settingsButton').onclick=()=>location.href='mail-settings.html';$('refreshButton').onclick=loadMessages;$('syncButton').onclick=async()=>{try{await mailApi('/sync',{method:'POST',body:'{}'});await loadMessages()}catch(e){alert(e.message)}};$('search').oninput=renderMessages;
