services:
  telemetry-proxy:
    build: .
    restart: unless-stopped
    environment:
      PORT: "10000"
      TELEMETRY_INGEST_TOKEN: "${TELEMETRY_INGEST_TOKEN}"
      SUPABASE_TELEMETRY_URL: "${SUPABASE_TELEMETRY_URL}"
      TELEMETRY_PROXY_PATH: "${TELEMETRY_PROXY_PATH:-/gp-vendsoft-telemetry}"
      TELEMETRY_PROXY_TOKEN: "${TELEMETRY_PROXY_TOKEN:-}"
      TELEMETRY_BODY_LIMIT_BYTES: "${TELEMETRY_BODY_LIMIT_BYTES:-5242880}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - telemetry-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      TELEMETRY_DOMAIN: "${TELEMETRY_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
