<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>OLVEND | Schválení nejeté zastávky</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#17212b;background:#f4f6f8;font-family:Inter,Arial,sans-serif}.card{width:min(100%,560px);padding:28px;border:1px solid #dfe3e8;border-radius:24px;background:#fff;box-shadow:0 18px 44px rgba(16,24,40,.12)}.brand{color:#d5101a;font-size:14px;font-weight:950;letter-spacing:.08em}.kicker{margin-top:24px;color:#667085;font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}h1{margin:8px 0 10px;font-size:30px;line-height:1.1}p{margin:0;color:#667085;font-size:15px;font-weight:700;line-height:1.55}.safe{margin:20px 0;padding:13px;border-radius:14px;color:#475467;background:#f2f4f7;font-size:13px;font-weight:750;line-height:1.45}button{width:100%;min-height:56px;padding:15px;border:0;border-radius:16px;color:#fff;background:#d5101a;font-size:17px;font-weight:950;cursor:pointer}button.reject{background:#344054}button:disabled{opacity:.55;cursor:wait}.result{display:none;margin-top:18px;padding:14px;border-radius:14px;font-size:14px;font-weight:850;line-height:1.45}.result.good{display:block;color:#067647;background:#ecfdf3}.result.bad{display:block;color:#b42318;background:#fef3f2}.foot{margin-top:18px;color:#98a2b3;font-size:11px;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">OLVEND</div>
    <div class="kicker">Nejetá zastávka</div>
    <h1 id="title">Načítám rozhodnutí</h1>
    <p id="copy">Kontroluji platnost odkazu.</p>
    <div class="safe">Pouhé otevření odkazu nic nemění. Rozhodnutí se uloží až po stisknutí tlačítka.</div>
    <button id="confirm" type="button" disabled>Načítám…</button>
    <div class="result" id="result" role="status"></div>
    <div class="foot">Jednorázové schválení · OLVEND 1.8</div>
  </main>
  <script>
    (()=>{
      const params=new URLSearchParams(location.search),token=params.get('token')||'',decision=params.get('decision')||'';
      const valid=token.length>=32&&['approve','reject'].includes(decision),approve=decision==='approve';
      const title=document.getElementById('title'),copy=document.getElementById('copy'),button=document.getElementById('confirm'),result=document.getElementById('result');
      if(!valid){title.textContent='Odkaz není platný';copy.textContent='Schvalovací odkaz je neúplný nebo poškozený.';result.className='result bad';result.textContent='Požádejte operátora, aby žádost odeslal znovu.';return}
      title.textContent=approve?'Schválit nejetí':'Zamítnout žádost';
      copy.textContent=approve?'Zastávka se označí jako nejetá, trasa se přepočítá a operátorovi se odemkne další místo.':'Zastávka zůstane v trase a operátor bude pokračovat podle aktuálního pořadí.';
      button.textContent=approve?'Potvrdit schválení':'Potvrdit zamítnutí';button.classList.toggle('reject',!approve);button.disabled=false;
      button.addEventListener('click',async()=>{button.disabled=true;button.textContent='Ukládám rozhodnutí…';result.className='result';try{const response=await fetch('https://rerjlkrhiytgscjerqgs.supabase.co/functions/v1/route-skip-approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'decision',token,decision})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Rozhodnutí se nepodařilo uložit.');const approved=data.status==='approved',rejected=data.status==='rejected';title.textContent=approved?'Nejetí bylo schváleno':rejected?'Žádost byla zamítnuta':'Žádost už byla vyřízena';copy.textContent=approved?'Mobil operátora se automaticky obnoví, přepočítá trasu a odemkne další zastávku.':rejected?'Operátor může pokračovat; zastávka zůstává v trase.':`Aktuální stav: ${data.status||'vyřízeno'}.`;result.className='result good';result.textContent='Rozhodnutí je bezpečně uložené v OLVENDu.';button.hidden=true;history.replaceState(null,'',location.pathname)}catch(error){result.className='result bad';result.textContent=error.message||'Rozhodnutí se nepodařilo uložit.';button.disabled=false;button.textContent=approve?'Zkusit schválení znovu':'Zkusit zamítnutí znovu'}});
    })();
  </script>
</body>
</html>
