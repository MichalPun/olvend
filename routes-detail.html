<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2f7" />
  <title>OLVEND | Detail trasy</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #eef2f7;
      --panel: #ffffff;
      --panel-soft: #f7f9fc;
      --border: rgba(15,23,42,0.11);
      --text: #17212b;
      --muted: #667085;
      --soft: #7b8494;
      --accent: #d5101a;
      --shadow: 0 16px 44px rgba(15,23,42,0.08);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(213,16,26,0.07), transparent 24%),
        linear-gradient(135deg, #f8fafc, #eef2f7, #f6f8fb);
    }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    .main {
      min-width: 0;
      padding: 24px;
    }

    .page-shell {
      display: grid;
      gap: 18px;
      width: min(100%, 1480px);
      margin: 0 auto;
    }

    .mobile-nav-shell {
      display: none;
      position: sticky;
      top: 0;
      z-index: 20;
      margin-bottom: 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .title h1 {
      margin: 0 0 8px;
      font-size: 38px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .title p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      max-width: 760px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
    }

    .btn.secondary {
      background: #ffffff;
      border: 1px solid var(--border);
      color: #17212b;
    }

    .btn.danger {
      background: rgba(255,91,102,0.18);
      border: 1px solid rgba(255,91,102,0.24);
      color: #ffc5ca;
    }

    .status-line {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      padding: 14px 18px;
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .status-line.success { color: #067647; }
    .status-line.warning { color: #b54708; }
    .status-line.error { color: #b42318; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .panel-header h2 {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.1;
    }

    .panel-header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .panel-body {
      padding: 12px;
    }

    .route-detail-panel {
      border-radius: 22px;
    }

    .route-detail-header {
      align-items: center;
      background:
        linear-gradient(90deg, rgba(213,16,26,0.08), transparent 36%),
        #ffffff;
    }

    .route-title-block {
      min-width: 0;
    }

    .route-title-block h2 {
      font-size: 26px;
      letter-spacing: -0.02em;
    }

    .route-title-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .route-header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .route-excel {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: auto;
      background: #ffffff;
    }

    .route-excel table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      table-layout: auto;
    }

    .route-excel th,
    .route-excel td {
      padding: 7px 9px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
      line-height: 1.25;
    }

    .route-excel th:last-child,
    .route-excel td:last-child {
      border-right: 0;
    }

    .route-excel tr:last-child th,
    .route-excel tr:last-child td {
      border-bottom: 0;
    }

    .route-excel th {
      color: #475467;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: #e9eef5;
      white-space: nowrap;
    }

    .route-excel td {
      color: var(--text);
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .route-excel .numeric {
      text-align: right;
      white-space: nowrap;
    }

    .route-excel .strong-number {
      font-size: 15px;
      font-weight: 900;
    }

    .route-excel .muted-cell {
      color: var(--muted);
      font-weight: 700;
    }

    .route-summary-sheet table {
      min-width: 860px;
    }

    .route-summary-sheet th {
      color: #344054;
      background: #e9eef5;
    }

    .route-summary-sheet .label-cell {
      width: 150px;
      color: var(--soft);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(236,241,248,0.42);
      white-space: nowrap;
    }

    .route-excel .diff-positive { color: #067647; }
    .route-excel .diff-negative { color: #b42318; }

    .route-map-strip {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin-top: 10px;
    }

    .route-map-toolbar {
      width: 190px;
      flex: 0 0 190px;
      display: grid;
      align-content: start;
      gap: 4px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f7f9fc;
    }

    .route-map-toolbar strong {
      font-size: 14px;
    }

    .route-map-toolbar span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .route-badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      background: #f2f4f7;
      border: 1px solid rgba(15,23,42,0.1);
      color: #344054;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .route-badge.live { color: #067647; border-color: #a6f4c5; background: #ecfdf3; }
    .route-badge.saved { color: #067647; border-color: #a6f4c5; background: #ecfdf3; }
    .route-badge.window { color: #175cd3; border-color: #b2ddff; background: #eff8ff; }
    .route-badge.heuristic { color: #b54708; border-color: #fedf89; background: #fffaeb; }
    .route-badge.critical { color: #b42318; border-color: #fecdca; background: #fef3f2; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .mini-stat {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .mini-stat-label {
      color: var(--soft);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .mini-stat-value {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .cash-report-list {
      display: grid;
      gap: 10px;
    }

    .cash-report-row {
      display: grid;
      grid-template-columns: minmax(220px, 1.35fr) minmax(130px, 0.75fr) minmax(130px, 0.75fr) minmax(140px, 0.8fr) minmax(180px, 1fr) auto;
      gap: 10px;
      align-items: end;
      padding: 12px;
      border-radius: 16px;
      background: var(--panel-soft);
      border: 1px solid rgba(15,23,42,0.09);
    }

    .cash-report-title {
      display: grid;
      gap: 4px;
      align-self: center;
      min-width: 0;
    }

    .cash-report-title strong {
      font-size: 15px;
      line-height: 1.25;
    }

    .cash-report-title span,
    .cash-report-field small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .cash-report-field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .cash-report-field label {
      color: var(--soft);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cash-report-field input,
    .cash-report-field select {
      width: 100%;
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,0.14);
      background: #ffffff;
      color: var(--text);
      padding: 9px 11px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }

    .cash-report-field input::placeholder {
      color: var(--soft);
    }

    .cash-report-field select option {
      background: #ffffff;
      color: #17212b;
    }

    .cash-report-diff {
      font-weight: 800;
      color: var(--muted);
    }

    .cash-report-diff.positive { color: #067647; }
    .cash-report-diff.negative { color: #b42318; }

    .map-shell {
      height: 360px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      margin-top: 18px;
    }

    .route-map-strip .map-shell {
      flex: 1;
      height: 190px;
      min-height: 190px;
      margin-top: 0;
      border-radius: 10px;
    }

    .route-excel input,
    .route-excel select {
      width: 100%;
      min-height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.7);
      color: var(--text);
      padding: 6px 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
    }

    .route-excel .btn {
      min-height: 32px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .stop-title-button {
      width: 100%;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: #17212b;
      font: inherit;
      font-weight: 850;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .stop-title-button:hover {
      color: #b90d16;
    }

    .stop-toggle-icon {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 7px;
      background: #eef2f7;
      color: #475467;
      transition: transform 0.18s ease;
    }

    .stop-title-button[aria-expanded="true"] .stop-toggle-icon {
      transform: rotate(90deg);
      background: #fee4e2;
      color: #b42318;
    }

    .stop-detail-row[hidden] {
      display: none;
    }

    .stop-detail-row td {
      padding: 0 !important;
      background: #f8fafc;
    }

    .stop-detail-panel {
      padding: 16px;
      display: grid;
      gap: 14px;
      border-top: 2px solid rgba(213,16,26,0.14);
    }

    .visit-card {
      padding: 14px;
      border: 1px solid rgba(15,23,42,0.11);
      border-radius: 12px;
      background: #ffffff;
      display: grid;
      gap: 12px;
    }

    .visit-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .visit-card-head strong {
      font-size: 15px;
    }

    .visit-card-head span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .visit-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }

    .visit-summary-item {
      padding: 9px 10px;
      border-radius: 9px;
      background: #f2f4f7;
    }

    .visit-summary-item small {
      display: block;
      color: #667085;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .visit-summary-item strong {
      font-size: 14px;
    }

    .visit-product-table {
      width: 100%;
      border-collapse: collapse;
    }

    .visit-product-table th,
    .visit-product-table td {
      padding: 8px 9px;
      border: 1px solid rgba(15,23,42,0.09);
      text-align: left;
      font-size: 12px;
    }

    .visit-product-table th {
      color: #475467;
      background: #eef2f7;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 9px;
    }

    .visit-empty {
      color: var(--muted);
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f2f4f7;
    }

    #routeMap { width: 100%; height: 100%; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #12151d; color: #fff; }
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.5; }

    .number-pin {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #d5101a;
      border: 2px solid rgba(255,255,255,0.8);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(213,16,26,0.35);
    }

    .section-stack {
      display: grid;
      gap: 18px;
    }

    .stop-list {
      display: grid;
      gap: 12px;
    }

    .stop-card {
      border-radius: 14px;
      background: var(--panel-soft);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 14px;
    }

    .stop-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .subtext {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .timeline {
      display: grid;
      gap: 10px;
    }

    .timeline-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .timeline-item strong {
      font-size: 14px;
    }

    .timeline-item span {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .empty-state {
      padding: 18px;
      border-radius: 16px;
      border: 1px dashed rgba(15,23,42,0.18);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      aside.sidebar {
        display: none;
      }

      .mobile-nav-shell {
        display: block;
      }

      .main {
        padding: 16px;
      }

      .topbar {
        flex-direction: column;
      }

      .title h1 {
        font-size: 30px;
      }

      .timeline-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .timeline-item span {
        text-align: left;
      }

      .route-map-strip {
        flex-direction: column;
      }

      .route-map-toolbar {
        width: 100%;
        flex-basis: auto;
      }

      .route-map-strip .map-shell {
        height: 240px;
      }

      .cash-report-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .route-detail-header,
      .route-header-actions,
      .route-map-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .route-header-actions .btn,
      .route-map-toolbar .btn {
        width: 100%;
      }

      .route-excel table {
        min-width: 860px;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="mobile-nav-shell" id="mobileNavShell"></div>
      <div class="page-shell">
        <header class="topbar">
          <div class="title">
            <h1>Detail trasy</h1>
            <p>Jedna trasa, všechny důležité informace na jednom místě. Zpět se vracíš na hlavní přehled tras.</p>
          </div>
          <div class="actions">
            <a class="btn secondary" href="routes.html">Zpět na Trasy</a>
          </div>
        </header>

        <div class="status-line" id="statusLine">Načítám detail trasy…</div>

        <div class="section-stack" id="detailShell">
          <section class="panel">
            <div class="panel-body">
              <div class="empty-state">Načítám trasu…</div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./sidebar.js?v=20260712lightfix2"></script>
  <script type="module">
    import { supabase } from './supabase.js'

    const LOCAL_STORAGE_KEY = 'olvendRoutePilotPlans'
    const statusLine = document.getElementById('statusLine')
    const detailShell = document.getElementById('detailShell')
    const routeId = new URLSearchParams(window.location.search).get('id')

    const state = {
      plan: null,
      employees: [],
      vehicles: [],
      warehouses: [],
      cashReports: [],
      mobileVisits: [],
      routeVehicleLog: null,
      map: null,
      mapLayer: null,
    }

    function setStatus(message, tone = '') {
      statusLine.hidden = false
      statusLine.textContent = message
      statusLine.className = `status-line${tone ? ` ${tone}` : ''}`
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;')
    }

    function formatNumber(value, digits = 0) {
      const number = Number(value ?? 0)
      if (Number.isNaN(number)) return '0'
      return number.toLocaleString('cs-CZ', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      })
    }

    function formatDateLabel(dateString) {
      if (!dateString) return 'Bez data'
      const date = new Date(`${dateString}T12:00:00`)
      if (Number.isNaN(date.getTime())) return dateString
      return date.toLocaleDateString('cs-CZ')
    }

    function formatDateTime(value) {
      if (!value) return '—'
      return new Date(value).toLocaleString('cs-CZ', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      })
    }

    function formatStopDuration(stop) {
      const timing = getStopVisitTiming(stop)
      if (!timing.startedAt) return '—'
      const arrivedAt = new Date(timing.startedAt)
      const finishedAt = timing.completedAt ? new Date(timing.completedAt) : new Date()
      if (Number.isNaN(arrivedAt.getTime()) || Number.isNaN(finishedAt.getTime()) || finishedAt < arrivedAt) return '—'

      const totalMinutes = Math.max(1, Math.round((finishedAt.getTime() - arrivedAt.getTime()) / 60000))
      const hours = Math.floor(totalMinutes / 60)
      const minutes = totalMinutes % 60
      const duration = hours
        ? `${hours} h${minutes ? ` ${minutes} min` : ''}`
        : `${minutes} min`

      return timing.completedAt ? duration : `probíhá · ${duration}`
    }

    function formatVisitDuration(visit) {
      if (!visit?.arrived_at) return '—'
      const startedAt = new Date(visit.arrived_at)
      const completedAt = visit.completed_at ? new Date(visit.completed_at) : new Date()
      if (Number.isNaN(startedAt.getTime()) || Number.isNaN(completedAt.getTime()) || completedAt < startedAt) return '—'
      const totalMinutes = Math.max(1, Math.round((completedAt.getTime() - startedAt.getTime()) / 60000))
      return visit.completed_at ? `${totalMinutes} min` : `probíhá · ${totalMinutes} min`
    }

    function formatMoney(value) {
      return new Intl.NumberFormat('cs-CZ', {
        style: 'currency',
        currency: 'CZK',
        maximumFractionDigits: 0,
      }).format(Number(value || 0))
    }

    function formatKm(value, digits = 0) {
      if (value == null || value === '' || Number.isNaN(Number(value))) return '—'
      return `${formatNumber(Number(value), digits)} km`
    }

    function getMileageSummary(plan) {
      const log = state.routeVehicleLog || null
      const startKm = log?.start_odometer_km != null ? Number(log.start_odometer_km) : null
      const realEndKm = log?.end_odometer_km != null ? Number(log.end_odometer_km) : null
      const expectedDistance = Number(plan?.estimatedDistanceKm || 0)
      const expectedEndKm = startKm != null && Number.isFinite(expectedDistance)
        ? Math.round(startKm + expectedDistance)
        : null
      const realDistanceKm = log?.distance_km != null
        ? Number(log.distance_km)
        : startKm != null && realEndKm != null
          ? realEndKm - startKm
          : null
      const diffKm = expectedEndKm != null && realEndKm != null ? realEndKm - expectedEndKm : null

      return {
        startKm,
        expectedEndKm,
        realEndKm,
        expectedDistance,
        realDistanceKm,
        diffKm,
        status: log?.status || null,
      }
    }

    function formatMileageDiff(value) {
      if (value == null || Number.isNaN(Number(value))) return 'Čeká na ukončení'
      const number = Number(value)
      if (number === 0) return '0 km'
      return `${number > 0 ? '+' : ''}${formatKm(number)}`
    }

    function getDiffClass(value) {
      const number = Number(value || 0)
      if (number > 0) return 'diff-negative'
      if (number < 0) return 'diff-positive'
      return ''
    }

    function getCashReport(machineId) {
      return state.cashReports.find((report) => String(report.machine_id) === String(machineId)) || null
    }

    function getMobileVisitForMachine(machineId) {
      return state.mobileVisits.find((visit) => String(visit.machine_id) === String(machineId)) || null
    }

    function getVisitCashReport(visit) {
      if (!visit) return null
      const nested = visit.route_machine_cash_reports
      if (Array.isArray(nested)) return nested[0] || null
      return nested || null
    }

    function getMobileVisitStatusLabel(visit) {
      const status = String(visit?.status || '').toLowerCase()
      const map = {
        draft: 'Rozpracováno',
        arrived: 'Na místě',
        completed: 'Hotovo',
        skipped: 'Přeskočeno',
        sync_error: 'Chyba sync',
      }
      return visit ? (map[status] || status || 'Zapsáno') : 'Čeká na mobil'
    }

    function getMobileCashStatusLabel(visit, cashReport) {
      if (!visit) return 'Čeká na mobil'
      if (!cashReport) return 'Bez zápisu hotovosti'
      return cashReport.operator_collected_confirmed ? 'Vybráno v mobilu' : 'Nevybráno v mobilu'
    }

    function nestedRows(value) {
      if (Array.isArray(value)) return value
      return value ? [value] : []
    }

    function getVisitsForStop(stop) {
      const stopId = String(stop?.id || '')
      const exact = state.mobileVisits.filter((visit) => String(visit.route_plan_stop_id || '') === stopId)
      if (exact.length) return exact

      const machineId = String(stop?.machine_id || stop?.machineId || '')
      return machineId
        ? state.mobileVisits.filter((visit) => String(visit.machine_id || '') === machineId)
        : []
    }

    function getStopVisitTiming(stop) {
      const visits = getVisitsForStop(stop).filter((visit) => visit?.arrived_at)
      const startedAt = visits.length
        ? visits.reduce((earliest, visit) => !earliest || new Date(visit.arrived_at) < new Date(earliest) ? visit.arrived_at : earliest, null)
        : stop?.arrived_at || null
      const completedVisits = visits.filter((visit) => visit?.completed_at)
      const completedAt = completedVisits.length
        ? completedVisits.reduce((latest, visit) => !latest || new Date(visit.completed_at) > new Date(latest) ? visit.completed_at : latest, null)
        : visits.find((visit) => visit?.skipped_at)?.skipped_at || stop?.completed_at || stop?.skipped_at || null
      return { startedAt, completedAt }
    }

    function getVisitMachineLabel(visit) {
      const machine = Array.isArray(visit?.machines) ? visit.machines[0] : visit?.machines
      if (machine) {
        const evidence = machine.evidence_number ? `EV ${machine.evidence_number}` : ''
        return [machine.name, evidence].filter(Boolean).join(' · ')
      }

      const breakdown = state.plan?.telemetryRevenue?.machineBreakdown || []
      const telemetryMachine = breakdown.find((row) => String(row.machineId) === String(visit?.machine_id))
      return telemetryMachine?.machineName || `Automat ${visit?.machine_id || ''}`
    }

    function issueTypeLabel(value) {
      const labels = {
        none: 'Bez problému',
        substitution: 'Náhrada sortimentu',
        expired: 'Prošlé',
        shaken: 'Vytřepané',
        damaged: 'Poškozené',
        missing_stock: 'Chybělo v autě',
        telemetry_mismatch: 'Neseděla telemetrie',
        other: 'Jiný důvod',
      }
      return labels[String(value || 'none')] || String(value || '—')
    }

    function formatVisitQuantity(value, unit = 'ks') {
      const number = Number(value || 0)
      return `${formatNumber(number, Number.isInteger(number) ? 0 : 1)} ${unit || 'ks'}`
    }

    function renderVisitDetail(visit) {
      const items = nestedRows(visit?.route_machine_visit_items)
      const fills = nestedRows(visit?.route_machine_visit_food_fills)
      const checks = nestedRows(visit?.route_machine_visit_checks)
      const cashReport = getVisitCashReport(visit)
      const filledItemRows = items.filter((item) => Number(item.actual_add_quantity || 0) > 0 && (item.item_kind !== 'food_slot' || !fills.length))
      const removedRows = items.filter((item) => Number(item.removed_quantity || 0) > 0)
      const completedChecks = checks.filter((check) => ['done', 'not_applicable'].includes(String(check.status || ''))).length
      const productRows = [
        ...fills.map((fill) => {
          const visitItem = items.find((item) => String(item.id) === String(fill.visit_item_id || ''))
          return {
            product: fill.product_name || `Produkt ${fill.product_id}`,
            sku: fill.product_sku || '',
            position: visitItem?.physical_position_label || visitItem?.telemetry_key || (fill.planogram_slot_id ? `Pozice ${fill.planogram_slot_id}` : 'Potraviny'),
            added: formatVisitQuantity(fill.quantity, 'ks'),
            before: visitItem?.actual_before_quantity == null ? '—' : formatVisitQuantity(visitItem.actual_before_quantity, visitItem.unit),
            final: visitItem?.final_quantity == null ? '—' : formatVisitQuantity(visitItem.final_quantity, visitItem.unit),
            expiry: fill.expiry_date ? formatDateLabel(fill.expiry_date) : '—',
          }
        }),
        ...filledItemRows.map((item) => ({
          product: item.actual_product_name || item.planned_product_name || 'Položka',
          sku: item.actual_product_sku || item.planned_product_sku || '',
          position: item.physical_position_label || item.telemetry_key || '—',
          added: formatVisitQuantity(item.actual_add_quantity, item.unit),
          before: item.actual_before_quantity == null ? '—' : formatVisitQuantity(item.actual_before_quantity, item.unit),
          final: item.final_quantity == null ? '—' : formatVisitQuantity(item.final_quantity, item.unit),
          expiry: '—',
        })),
      ]

      return `
        <article class="visit-card">
          <div class="visit-card-head">
            <div>
              <strong>${escapeHtml(getVisitMachineLabel(visit))}</strong>
              <span>${escapeHtml(formatDateTime(visit.completed_at || visit.arrived_at))}${visit.operator_note ? ` · ${escapeHtml(visit.operator_note)}` : ''}</span>
            </div>
            <span class="route-badge ${visit.status === 'completed' ? 'saved' : visit.status === 'arrived' ? 'live' : 'window'}">${escapeHtml(getMobileVisitStatusLabel(visit))}</span>
          </div>
          <div class="visit-summary-grid">
            <div class="visit-summary-item"><small>Doplněno</small><strong>${productRows.length} ${productRows.length === 1 ? 'položka' : productRows.length >= 2 && productRows.length <= 4 ? 'položky' : 'položek'}</strong></div>
            <div class="visit-summary-item"><small>Čas od otevření picklistu</small><strong>${escapeHtml(formatVisitDuration(visit))}</strong></div>
            <div class="visit-summary-item"><small>Odpis / odebráno</small><strong>${escapeHtml(formatVisitQuantity(removedRows.reduce((sum, row) => sum + Number(row.removed_quantity || 0), 0), 'ks'))}</strong></div>
            <div class="visit-summary-item"><small>Úkony</small><strong>${completedChecks}/${checks.length || 0} potvrzeno</strong></div>
            <div class="visit-summary-item"><small>Hotovost</small><strong>${escapeHtml(getMobileCashStatusLabel(visit, cashReport))}</strong></div>
          </div>
          ${productRows.length ? `
            <div>
              <strong>Doplněné položky</strong>
              <div style="height: 7px;"></div>
              <table class="visit-product-table">
                <thead><tr><th>Produkt</th><th>Pozice</th><th>Před</th><th>Doplněno</th><th>Po doplnění</th><th>Expirace</th></tr></thead>
                <tbody>
                  ${productRows.map((row) => `
                    <tr>
                      <td><strong>${escapeHtml(row.product)}</strong>${row.sku ? `<span class="subtext">SKU ${escapeHtml(row.sku)}</span>` : ''}</td>
                      <td>${escapeHtml(row.position)}</td>
                      <td>${escapeHtml(row.before)}</td>
                      <td><strong>${escapeHtml(row.added)}</strong></td>
                      <td>${escapeHtml(row.final)}</td>
                      <td>${escapeHtml(row.expiry)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : '<div class="visit-empty">U této návštěvy nebylo zaznamenáno žádné doplnění.</div>'}
          ${removedRows.length ? `
            <div>
              <strong>Odpisy a odebrané kusy</strong>
              <div style="height: 7px;"></div>
              <table class="visit-product-table">
                <thead><tr><th>Produkt</th><th>Pozice</th><th>Množství</th><th>Důvod</th><th>Poznámka</th></tr></thead>
                <tbody>
                  ${removedRows.map((item) => `
                    <tr>
                      <td>${escapeHtml(item.actual_product_name || item.planned_product_name || 'Položka')}</td>
                      <td>${escapeHtml(item.physical_position_label || item.telemetry_key || '—')}</td>
                      <td><strong>${escapeHtml(formatVisitQuantity(item.removed_quantity, item.unit))}</strong></td>
                      <td>${escapeHtml(issueTypeLabel(item.issue_type))}</td>
                      <td>${escapeHtml(item.operator_note || item.substitution_reason || '—')}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : ''}
        </article>
      `
    }

    function renderStopVisitDetail(stop) {
      const visits = getVisitsForStop(stop)
      const skippedVisit = visits.find((visit) => visit.status === 'skipped')
      if (skippedVisit) {
        return `
          <div class="stop-detail-panel">
            <div class="visit-empty">
              <strong>Zastávka nebyla jetá.</strong><br />
              Důvod: ${escapeHtml(getSkipReasonLabel(skippedVisit.skip_reason))}${skippedVisit.operator_note ? `<br />Poznámka: ${escapeHtml(skippedVisit.operator_note)}` : ''}<br />
              Zapsáno: ${escapeHtml(formatDateTime(skippedVisit.skipped_at))}
            </div>
          </div>
        `
      }
      return `
        <div class="stop-detail-panel">
          ${visits.length
            ? visits.map(renderVisitDetail).join('')
            : '<div class="visit-empty">K této zastávce zatím není uložená návštěva z mobilní aplikace.</div>'}
        </div>
      `
    }

    function getSkipReasonLabel(reason) {
      const labels = {
        opening_hours: 'Nestihl/a otevírací dobu',
        time_shortage: 'Nestihl/a zastávku',
        location_closed: 'Provozovna byla zavřená',
        no_access: 'Nebyl možný přístup k automatu',
        machine_unavailable: 'Automat nebyl dostupný',
        other: 'Jiný důvod'
      }
      return labels[String(reason || '')] || String(reason || 'Důvod neuveden')
    }

    function renderCashReportSection(plan) {
      const breakdown = Array.isArray(plan?.telemetryRevenue?.machineBreakdown)
        ? plan.telemetryRevenue.machineBreakdown
        : []

      return `
        <section class="panel">
          <div class="panel-header">
            <div>
              <h2>Svoz hotovosti</h2>
              <p>Kontrola z mobilní aplikace. Operátorka potvrzuje výběr a sáček v mobilu, desktop tady jen vyhodnocuje.</p>
            </div>
          </div>
          <div class="panel-body">
            ${breakdown.length ? `
              <div class="route-excel">
                <table>
                  <thead>
                    <tr>
                      <th>Automat</th>
                      <th>Lokalita</th>
                      <th>Návštěva v mobilu</th>
                      <th>Svoz v mobilu</th>
                      <th class="numeric">Oček. hotovost</th>
                      <th class="numeric">Kartou</th>
                      <th>Sáček</th>
                      <th class="numeric">Reálně dovezeno</th>
                      <th>Rozdíl</th>
                      <th>Poznámka</th>
                      <th>Akce</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${breakdown.map((row) => {
                      const legacyReport = getCashReport(row.machineId)
                      const visit = getMobileVisitForMachine(row.machineId)
                      const mobileCash = getVisitCashReport(visit)
                      const expectedCash = Number(mobileCash?.expected_cash_czk ?? row.expectedCashCzk ?? legacyReport?.expected_cash_czk ?? 0)
                      const expectedCard = Number(mobileCash?.expected_card_czk ?? row.expectedCardCzk ?? legacyReport?.expected_card_czk ?? 0)
                      const countedCash = mobileCash?.supervisor_counted_cash_czk ?? legacyReport?.actual_cash_czk ?? null
                      const diff = mobileCash?.difference_cash_czk ?? legacyReport?.difference_cash_czk ?? null
                      const diffText = diff != null
                        ? `${Number(diff) > 0 ? '+' : ''}${formatMoney(diff)}`
                        : mobileCash?.operator_collected_confirmed === false
                          ? 'Nesvezeno'
                          : 'Čeká'
                      const canCountCash = Boolean(visit && mobileCash?.operator_collected_confirmed === true)
                      return `
                        <tr>
                          <td><strong>${escapeHtml(row.machineName || `Stroj ${row.machineId}`)}</strong></td>
                          <td class="muted-cell">${escapeHtml(row.locationName || 'Bez lokality')}</td>
                          <td>${escapeHtml(getMobileVisitStatusLabel(visit))}</td>
                          <td>${escapeHtml(getMobileCashStatusLabel(visit, mobileCash))}</td>
                          <td class="numeric strong-number">${escapeHtml(formatMoney(expectedCash))}</td>
                          <td class="numeric">${escapeHtml(formatMoney(expectedCard))}</td>
                          <td>${escapeHtml(mobileCash?.operator_bag_label || '—')}</td>
                          <td>${canCountCash ? `<input data-supervisor-cash="${escapeHtml(visit.id)}" type="number" step="1" min="0" value="${escapeHtml(countedCash ?? '')}" placeholder="${escapeHtml(String(Math.round(expectedCash)))}" />` : '—'}</td>
                          <td class="${escapeHtml(getDiffClass(diff))}">${escapeHtml(diffText)}</td>
                          <td>
                            ${visit ? `<input data-supervisor-note="${escapeHtml(visit.id)}" type="text" value="${escapeHtml(mobileCash?.note || legacyReport?.note || '')}" placeholder="např. chybí 50 Kč" />` : escapeHtml('Čeká na mobilní zápis.')}
                          </td>
                          <td>${canCountCash ? `<button class="btn secondary" type="button" data-save-supervisor-cash="${escapeHtml(visit.id)}" data-cash-report-id="${escapeHtml(mobileCash?.id || '')}" data-machine-id="${escapeHtml(row.machineId)}" data-expected-cash="${escapeHtml(expectedCash)}" data-expected-card="${escapeHtml(expectedCard)}">Uložit přepočet</button>` : '—'}</td>
                        </tr>
                      `
                    }).join('')}
                  </tbody>
                </table>
              </div>
            ` : '<div class="empty-state">Pro tuhle trasu zatím nemám online tržby ze strojů. Jakmile bude v trase stroj s telemetrií, objeví se tady očekávaná hotovost a karta.</div>'}
          </div>
        </section>
      `
    }

    function getExecutionStatusMeta(status) {
      const normalized = String(status || 'draft').toLowerCase()
      const map = {
        draft: { label: 'Vytvořeno', cls: 'heuristic' },
        assigned: { label: 'Přiřazeno', cls: 'window' },
        in_progress: { label: 'V terénu', cls: 'live' },
        done: { label: 'Hotovo', cls: 'saved' },
        cancelled: { label: 'Zrušeno', cls: 'critical' },
      }
      return map[normalized] || map.draft
    }

    function isStopDone(stop) {
      return ['done', 'completed'].includes(String(stop?.status || '')) || Boolean(stop?.completed_at)
    }

    function isStopClosed(stop) {
      return isStopDone(stop) || String(stop?.status || '') === 'skipped'
    }

    function getEffectiveExecutionStatus(plan) {
      const status = String(plan?.execution_status || 'draft')
      if (['done', 'cancelled'].includes(status)) return status
      const stops = Array.isArray(plan?.orderedStops) ? plan.orderedStops : []
      const allStopsDone = stops.length > 0 && stops.every(isStopClosed)
      if (plan?.completed_at || allStopsDone) return 'done'
      return status
    }

    function getPlanKey(plan) {
      return String(plan?.id || plan?.local_saved_at || plan?.title || '')
    }

    function getSavedPlanEmployeeLabel(plan) {
      const payloadName = plan?.route_payload?.planned_employee_name
      if (payloadName && payloadName !== 'Bez výběru') return payloadName
      const employeeId = plan?.planned_employee_id
      if (!employeeId) return 'Bez zaměstnance'
      const employee = state.employees.find((item) => String(item.id) === String(employeeId))
      return employee ? ([employee.name, employee.surname].filter(Boolean).join(' ') || employee.email || 'Bez zaměstnance') : 'Bez zaměstnance'
    }

    function getWarehouseLabel(plan) {
      if (plan?.warehouse_id) {
        const warehouse = state.warehouses.find((item) => String(item.id) === String(plan.warehouse_id))
        if (warehouse?.name) return warehouse.name
      }
      return plan?.route_payload?.startPoint?.label || 'Bez skladu'
    }

    function buildPlan(plan) {
      const payload = plan.route_payload || {}
      const payloadStops = Array.isArray(payload.orderedStops) ? payload.orderedStops : []
      const dbStops = Array.isArray(plan.route_plan_stops) ? plan.route_plan_stops : []

      const orderedStops = (dbStops.length ? dbStops : payloadStops)
        .slice()
        .sort((a, b) => Number(a.stop_order || 0) - Number(b.stop_order || 0))
        .map((stop, index) => ({
          ...stop,
          id: stop.id || `${getPlanKey(plan)}-${index}`,
          title: stop.title || stop.name || `Zastávka ${index + 1}`,
          name: stop.name || stop.title || `Zastávka ${index + 1}`,
          address: stop.address || stop.address_snapshot || '',
          city: stop.city || stop.city_snapshot || '',
          latitude: stop.latitude != null ? Number(stop.latitude) : null,
          longitude: stop.longitude != null ? Number(stop.longitude) : null,
          estimatedServiceMinutes: Number(stop.estimatedServiceMinutes ?? stop.estimated_service_minutes ?? 0),
        }))

      return {
        ...plan,
        ...payload,
        orderedStops,
        title: plan.title || payload.title || `Trasa ${formatDateLabel(plan.planning_date)}`,
        vehicle_label: plan.vehicle_id
          ? state.vehicles.find((item) => String(item.id) === String(plan.vehicle_id))?.vehicle_label || 'Bez vozidla'
          : 'Bez vozidla',
        planned_employee_name: getSavedPlanEmployeeLabel(plan),
        estimatedDistanceKm: Number(plan.estimated_distance_km ?? payload.estimatedDistanceKm ?? 0),
        estimatedDriveMinutes: Number(plan.estimated_drive_minutes ?? payload.estimatedDriveMinutes ?? 0),
        estimatedServiceMinutes: Number(plan.estimated_service_minutes ?? payload.estimatedServiceMinutes ?? orderedStops.reduce((sum, stop) => sum + Number(stop.estimatedServiceMinutes || 0), 0)),
        telemetryRevenue: payload.telemetryRevenue || plan.telemetryRevenue || null,
      }
    }

    function buildMapSearchUrl(item) {
      if (item?.latitude != null && item?.longitude != null) {
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${item.latitude},${item.longitude}`)}`
      }
      const query = [item?.name, item?.title, item?.address, item?.city].filter(Boolean).join(', ')
      return query ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}` : '#'
    }

    function buildMultiStopMapsUrl(plan) {
      const stops = Array.isArray(plan?.orderedStops) ? plan.orderedStops.filter((stop) => stop.latitude != null && stop.longitude != null) : []
      if (!stops.length) return null

      const origin = plan.start_latitude != null && plan.start_longitude != null
        ? `${plan.start_latitude},${plan.start_longitude}`
        : `${stops[0].latitude},${stops[0].longitude}`

      const destination = plan.return_to_start
        ? origin
        : `${stops[stops.length - 1].latitude},${stops[stops.length - 1].longitude}`

      const waypointStops = plan.return_to_start ? stops : stops.slice(0, -1)
      const waypoints = waypointStops.map((stop) => `${stop.latitude},${stop.longitude}`).join('|')
      const params = new URLSearchParams({
        api: '1',
        origin,
        destination,
        travelmode: 'driving',
      })

      if (waypoints) params.set('waypoints', waypoints)
      return `https://www.google.com/maps/dir/?${params.toString()}`
    }

    function ensureMap() {
      const container = document.getElementById('routeMap')
      if (!container) return

      if (state.map) {
        const currentContainer = state.map.getContainer()
        if (currentContainer === container) return
        state.map.remove()
        state.map = null
        state.mapLayer = null
      }

      state.map = L.map('routeMap', { zoomControl: true }).setView([49.85, 15.5], 7)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(state.map)
      state.mapLayer = L.layerGroup().addTo(state.map)
    }

    function renderMap(plan) {
      if (!document.getElementById('routeMap')) return
      ensureMap()
      state.mapLayer.clearLayers()

      const points = Array.isArray(plan?.orderedStops)
        ? plan.orderedStops.filter((stop) => stop.latitude != null && stop.longitude != null)
        : []

      if (!points.length) {
        state.map.setView([49.85, 15.5], 7)
        return
      }

      const bounds = []

      if (plan.start_latitude != null && plan.start_longitude != null) {
        L.circleMarker([plan.start_latitude, plan.start_longitude], {
          radius: 9,
          color: '#ffffff',
          weight: 2,
          fillColor: '#1e90ff',
          fillOpacity: 0.95,
        })
          .bindPopup(`<strong>Start</strong><br>${escapeHtml(plan.route_payload?.startPoint?.label || 'Sklad / základna')}`)
          .addTo(state.mapLayer)
        bounds.push([plan.start_latitude, plan.start_longitude])
      }

      const latLngs = points.map((stop, index) => {
        const latLng = [stop.latitude, stop.longitude]
        bounds.push(latLng)
        L.marker(latLng, {
          icon: L.divIcon({
            className: '',
            html: `<div class="number-pin">${index + 1}</div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 17],
          }),
        })
          .bindPopup(`<strong>${escapeHtml(stop.title || stop.name)}</strong><br>${escapeHtml([stop.address, stop.city].filter(Boolean).join(', ') || 'Bez adresy')}`)
          .addTo(state.mapLayer)
        return latLng
      })

      if (latLngs.length >= 2) {
        L.polyline(latLngs, {
          color: '#d5101a',
          weight: 4,
          opacity: 0.82,
        }).addTo(state.mapLayer)
      }

      state.map.fitBounds(bounds, { padding: [30, 30] })
    }

    function renderDetail() {
      const plan = state.plan
      if (!plan) {
        detailShell.innerHTML = `
          <section class="panel">
            <div class="panel-body">
              <div class="empty-state">Trasa se nenašla. Vrať se do seznamu a otevři ji znovu.</div>
            </div>
          </section>
        `
        return
      }

      const effectiveStatus = getEffectiveExecutionStatus(plan)
      const statusMeta = getExecutionStatusMeta(effectiveStatus)
      const mapsUrl = buildMultiStopMapsUrl(plan)
      const stops = Array.isArray(plan.orderedStops) ? plan.orderedStops : []
      const canEdit = !['in_progress', 'done', 'cancelled'].includes(effectiveStatus)
      const canComplete = !['done', 'cancelled'].includes(effectiveStatus)
      const canCancel = !['done', 'cancelled'].includes(effectiveStatus)
      const routeKey = getPlanKey(plan)
      const telemetry = plan.telemetryRevenue || {}
      const revenue = Number(telemetry.revenue || 0)
      const cashAmount = Number(telemetry.cashAmount || 0)
      const cashlessAmount = Number(telemetry.cashlessAmount || 0)
      const mileage = getMileageSummary(plan)

      detailShell.innerHTML = `
        <section class="panel route-detail-panel">
          <div class="panel-header route-detail-header">
            <div class="route-title-block">
              <h2>${escapeHtml(plan.title)}</h2>
              <div class="route-title-meta">
                <span>${escapeHtml(formatDateLabel(plan.planning_date))}</span>
                <span>·</span>
                <span>${escapeHtml(plan.planned_employee_name || 'Bez zaměstnance')}</span>
                <span>·</span>
                <span>${formatNumber(stops.length)} zastávek</span>
              </div>
            </div>
            <div class="route-header-actions">
              <span class="route-badge ${escapeHtml(statusMeta.cls)}">${escapeHtml(statusMeta.label)}</span>
              ${canEdit ? `<a class="btn secondary" href="routes-create.html?edit=${encodeURIComponent(routeKey)}">Upravit</a>` : ''}
              ${canComplete ? '<button class="btn" id="markDoneBtn" type="button">Označit hotovo</button>' : ''}
            </div>
          </div>
          <div class="panel-body">
            <div class="route-excel route-summary-sheet">
              <table>
                <tbody>
                  <tr>
                    <th colspan="2">Trasa</th>
                    <th colspan="2">Provoz</th>
                  </tr>
                  <tr>
                    <td class="label-cell">Datum</td>
                    <td class="strong-number">${escapeHtml(formatDateLabel(plan.planning_date))}</td>
                    <td class="label-cell">Stav</td>
                    <td><span class="route-badge ${escapeHtml(statusMeta.cls)}">${escapeHtml(statusMeta.label)}</span></td>
                  </tr>
                  <tr>
                    <td class="label-cell">Zaměstnanec</td>
                    <td class="strong-number">${escapeHtml(plan.planned_employee_name || 'Bez zaměstnance')}</td>
                    <td class="label-cell">Sklad</td>
                    <td class="strong-number">${escapeHtml(getWarehouseLabel(plan))}</td>
                  </tr>
                  <tr>
                    <td class="label-cell">Vozidlo</td>
                    <td>${escapeHtml(plan.vehicle_label || 'Bez vozidla')}</td>
                    <td class="label-cell">Návrat</td>
                    <td>${plan.return_to_start ? 'Vrací se na start' : 'Bez návratu na start'}</td>
                  </tr>
                  <tr>
                    <th colspan="2">Plán jízdy</th>
                    <th colspan="2">Kilometry</th>
                  </tr>
                  <tr>
                    <td class="label-cell">Zastávky</td>
                    <td class="strong-number">${formatNumber(stops.length)} zastávek</td>
                    <td class="label-cell">Start km</td>
                    <td class="numeric">${escapeHtml(formatKm(mileage.startKm))}</td>
                  </tr>
                  <tr>
                    <td class="label-cell">Servisní čas</td>
                    <td>${formatNumber(plan.estimatedServiceMinutes)} min</td>
                    <td class="label-cell">Plán km</td>
                    <td class="numeric strong-number">${escapeHtml(formatKm(mileage.expectedDistance, 1))}</td>
                  </tr>
                  <tr>
                    <td class="label-cell">Čas za volantem</td>
                    <td>${formatNumber(plan.estimatedDriveMinutes)} min</td>
                    <td class="label-cell">Očekávaný konec</td>
                    <td class="numeric strong-number">${escapeHtml(formatKm(mileage.expectedEndKm))}</td>
                  </tr>
                  <tr>
                    <td class="label-cell">Mapa</td>
                    <td>${formatNumber(stops.length)} bodů · ${formatNumber(plan.estimatedDistanceKm, 1)} km</td>
                    <td class="label-cell">Reálný konec</td>
                    <td class="numeric strong-number">${escapeHtml(formatKm(mileage.realEndKm))}</td>
                  </tr>
                  <tr>
                    <th colspan="2">Očekávaná tržba</th>
                    <th colspan="2">Kontrola km</th>
                  </tr>
                  <tr>
                    <td class="label-cell">Celkem</td>
                    <td class="numeric strong-number">${escapeHtml(formatMoney(revenue))}</td>
                    <td class="label-cell">Rozdíl</td>
                    <td class="numeric strong-number ${escapeHtml(getDiffClass(mileage.diffKm))}">${escapeHtml(formatMileageDiff(mileage.diffKm))}</td>
                  </tr>
                  <tr>
                    <td class="label-cell">Hotově</td>
                    <td class="numeric strong-number">${escapeHtml(formatMoney(cashAmount))}</td>
                    <td class="label-cell">Zdroj km</td>
                    <td>${state.routeVehicleLog ? 'Ukončení směny / mobil' : 'Čeká na ukončení směny'}</td>
                  </tr>
                  <tr>
                    <td class="label-cell">Kartou</td>
                    <td class="numeric strong-number">${escapeHtml(formatMoney(cashlessAmount))}</td>
                    <td class="label-cell">Zdroj tržby</td>
                    <td>Online prodeje strojů v trase</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="route-map-strip">
              <div class="route-map-toolbar">
                <strong>Mapa trasy</strong>
                <span>${formatNumber(stops.length)} bodů</span>
                <span>${formatNumber(plan.estimatedDistanceKm, 1)} km</span>
              </div>
              <div class="map-shell">
                <div id="routeMap"></div>
              </div>
            </div>
            <div class="detail-actions">
              ${mapsUrl ? `<a class="btn secondary" href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener noreferrer">Otevřít v Google Maps</a>` : ''}
              ${canCancel ? '<button class="btn danger" id="cancelRouteBtn" type="button">Zrušit</button>' : ''}
            </div>
          </div>
        </section>

        ${renderCashReportSection(plan)}

        <section class="panel">
          <div class="panel-header">
            <div>
              <h2>Zastávky</h2>
              <p>Detailní průběh a body, které trasa obsahuje.</p>
            </div>
          </div>
          <div class="panel-body">
            ${stops.length ? `
              <div class="route-excel">
                <table>
                  <thead>
                    <tr>
                      <th>#</th>
                      <th>Zastávka</th>
                      <th>Adresa</th>
                      <th>Stav</th>
                      <th>Příjezd</th>
                      <th>Dokončeno</th>
                      <th class="numeric">Doba na místě</th>
                      <th>Priorita</th>
                      <th>Akce</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${stops.map((stop, index) => {
                      const stopDetailId = `stop-detail-${String(stop.id || index).replace(/[^a-zA-Z0-9_-]/g, '-')}`
                      const stopStatus = isStopDone(stop)
                        ? { label: 'Hotovo', cls: 'saved' }
                        : stop.status === 'skipped'
                          ? { label: 'Přeskočeno', cls: 'heuristic' }
                          : stop.status === 'in_progress'
                            ? { label: 'Na místě', cls: 'live' }
                            : { label: 'Čeká', cls: 'window' }
                      return `
                        <tr>
                          <td class="numeric">${index + 1}</td>
                          <td>
                            <button class="stop-title-button" type="button" data-stop-toggle="${escapeHtml(stopDetailId)}" aria-expanded="false" aria-controls="${escapeHtml(stopDetailId)}">
                              <span class="stop-toggle-icon">›</span>
                              <span>${escapeHtml(stop.title || stop.name || 'Zastávka')}</span>
                            </button>
                          </td>
                          <td>${escapeHtml([stop.address, stop.city].filter(Boolean).join(', ') || 'Bez adresy')}</td>
                          <td><span class="route-badge ${escapeHtml(stopStatus.cls)}">${escapeHtml(stopStatus.label)}</span></td>
                          <td>${escapeHtml(formatDateTime(getStopVisitTiming(stop).startedAt))}</td>
                          <td>${escapeHtml(formatDateTime(getStopVisitTiming(stop).completedAt))}</td>
                          <td class="numeric">${escapeHtml(formatStopDuration(stop))}</td>
                          <td>${escapeHtml(stop.priority_snapshot || '—')}</td>
                          <td><a class="btn secondary" href="${escapeHtml(buildMapSearchUrl(stop))}" target="_blank" rel="noopener noreferrer">Mapa</a></td>
                        </tr>
                        <tr class="stop-detail-row" id="${escapeHtml(stopDetailId)}" hidden>
                          <td colspan="9">${renderStopVisitDetail(stop)}</td>
                        </tr>
                      `
                    }).join('')}
                  </tbody>
                </table>
              </div>
            ` : '<div class="empty-state">Tahle trasa ještě nemá uložené zastávky.</div>'}
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <div>
              <h2>Průběh trasy</h2>
              <p>Rychlá osa toho, co se s trasou stalo.</p>
            </div>
          </div>
          <div class="panel-body">
            <div class="route-excel">
              <table>
                <thead>
                  <tr>
                    <th>Krok</th>
                    <th>Čas</th>
                    <th>Stav</th>
                    <th>Poznámka</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td><strong>Vytvořeno</strong></td><td>${escapeHtml(formatDateTime(plan.created_at))}</td><td>OK</td><td>Trasa založena.</td></tr>
                  <tr><td><strong>Přiřazeno</strong></td><td>${escapeHtml(formatDateTime(plan.assigned_at))}</td><td>${plan.assigned_at ? 'OK' : 'Čeká'}</td><td>${escapeHtml(plan.planned_employee_name || 'Bez zaměstnance')}</td></tr>
                  <tr><td><strong>Start</strong></td><td>${escapeHtml(formatDateTime(plan.started_at))}</td><td>${plan.started_at ? 'OK' : 'Čeká'}</td><td>Mobilní průběh trasy.</td></tr>
                  <tr><td><strong>Dokončeno</strong></td><td>${escapeHtml(formatDateTime(plan.completed_at))}</td><td>${plan.completed_at ? 'OK' : 'Čeká'}</td><td>Ukončení trasy a km kontrola.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      `

      renderMap(plan)

      document.getElementById('markDoneBtn')?.addEventListener('click', () => updateRouteStatus('done'))
      document.getElementById('cancelRouteBtn')?.addEventListener('click', () => updateRouteStatus('cancelled'))
      detailShell.querySelectorAll('[data-save-supervisor-cash]').forEach((button) => {
        button.addEventListener('click', () => saveSupervisorCashCount(button))
      })
      detailShell.querySelectorAll('[data-stop-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const detailId = button.dataset.stopToggle
          const detailRow = detailId ? document.getElementById(detailId) : null
          if (!detailRow) return
          const willOpen = detailRow.hidden
          detailRow.hidden = !willOpen
          button.setAttribute('aria-expanded', String(willOpen))
        })
      })
    }

    async function loadLookups() {
      const [vehiclesResult, employeesResult, warehousesResult] = await Promise.all([
        supabase.from('vehicles').select('id, plate, brand, model, name, active').eq('active', true).order('plate', { ascending: true }),
        supabase.from('employees').select('id, name, surname, email, active').order('surname', { ascending: true }),
        supabase.from('warehouses').select('id, name').order('name', { ascending: true }),
      ])

      if (vehiclesResult.error) throw vehiclesResult.error
      if (employeesResult.error) throw employeesResult.error
      if (warehousesResult.error) throw warehousesResult.error

      state.vehicles = (vehiclesResult.data || []).map((vehicle) => ({
        ...vehicle,
        vehicle_label: [vehicle.plate, vehicle.brand, vehicle.model, vehicle.name].filter(Boolean).join(' · ') || `Vozidlo ${vehicle.id}`,
      }))
      state.employees = (employeesResult.data || []).filter((employee) => employee.active !== false)
      state.warehouses = warehousesResult.data || []
    }

    async function loadCashReports(routePlanId) {
      state.cashReports = []
      if (!Number.isFinite(Number(routePlanId))) return

      const { data, error } = await supabase
        .from('route_cash_reports')
        .select('id, route_plan_id, route_plan_stop_id, machine_id, location_id, collection_status, expected_cash_czk, expected_card_czk, expected_total_czk, actual_cash_czk, difference_cash_czk, telemetry_from_at, telemetry_to_at, reported_at, note')
        .eq('route_plan_id', Number(routePlanId))
        .order('reported_at', { ascending: false })

      if (error) {
        if (String(error.message || '').includes('route_cash_reports')) return
        throw error
      }

      state.cashReports = data || []
    }

    async function loadMobileRouteExecution(routePlanId) {
      state.mobileVisits = []
      if (!Number.isFinite(Number(routePlanId))) return

      const { data, error } = await supabase
        .from('route_machine_visits')
        .select('id, route_plan_id, route_plan_stop_id, machine_id, employee_id, vehicle_id, visit_date, status, arrived_at, completed_at, skipped_at, skip_reason, operator_note, synced_at, machines(id, name, evidence_number, machine_type), route_machine_cash_reports(id, expected_cash_czk, expected_card_czk, expected_total_czk, operator_bag_label, operator_collected_confirmed, operator_collected_at, supervisor_counted_cash_czk, difference_cash_czk, note), route_machine_visit_items(id, item_kind, planogram_slot_id, physical_position_label, telemetry_key, planned_product_sku, planned_product_name, actual_product_sku, actual_product_name, system_current_quantity, actual_before_quantity, suggested_add_quantity, actual_add_quantity, removed_quantity, final_quantity, capacity_quantity, unit, issue_type, substitution_reason, operator_note), route_machine_visit_checks(id, check_key, label, required, status, completed_at, operator_note), route_machine_visit_food_fills(id, visit_item_id, planogram_slot_id, product_sku, product_name, quantity, expiry_date, sale_price_czk, load_order)')
        .eq('route_plan_id', Number(routePlanId))
        .order('created_at', { ascending: false })

      if (error) {
        if (/route_machine_visits|route_machine_cash_reports|route_machine_visit_items|route_machine_visit_checks|route_machine_visit_food_fills/i.test(String(error.message || ''))) return
        throw error
      }

      state.mobileVisits = data || []
    }

    async function loadRouteVehicleLog(plan) {
      state.routeVehicleLog = null
      if (!plan?.vehicle_id || !plan?.planning_date) return

      try {
        let attendanceDayId = null
        if (plan.planned_employee_id) {
          const { data: day, error: dayError } = await supabase
            .from('attendance_days')
            .select('id, actual_start, actual_end, status')
            .eq('employee_id', plan.planned_employee_id)
            .eq('attendance_date', plan.planning_date)
            .eq('vehicle_id', Number(plan.vehicle_id))
            .maybeSingle()

          if (!dayError && day?.id) {
            attendanceDayId = day.id
          } else if (dayError && !/attendance_days/i.test(String(dayError.message || ''))) {
            console.warn('Route attendance lookup failed:', dayError)
          }
        }

        let query = supabase
          .from('vehicle_operation_logs')
          .select('id, attendance_day_id, vehicle_id, employee_id, log_date, started_at, ended_at, start_odometer_km, end_odometer_km, distance_km, status, trip_note')
          .eq('vehicle_id', Number(plan.vehicle_id))
          .eq('log_date', plan.planning_date)
          .order('created_at', { ascending: false })
          .limit(1)

        if (attendanceDayId) {
          query = query.eq('attendance_day_id', attendanceDayId)
        } else if (plan.planned_employee_id) {
          query = query.eq('employee_id', plan.planned_employee_id)
        }

        const { data, error } = await query.maybeSingle()
        if (error) {
          if (/vehicle_operation_logs/i.test(String(error.message || ''))) return
          throw error
        }

        state.routeVehicleLog = data || null
      } catch (error) {
        console.warn('Route vehicle km lookup failed:', error)
        state.routeVehicleLog = null
      }
    }

    async function getCurrentEmployeeId() {
      try {
        const { data: sessionData } = await supabase.auth.getSession()
        const authUserId = sessionData?.session?.user?.id
        if (!authUserId) return null

        const { data, error } = await supabase
          .from('employees')
          .select('id')
          .eq('auth_user_id', authUserId)
          .maybeSingle()

        if (error) return null
        return data?.id || null
      } catch (error) {
        console.warn('Current employee lookup failed:', error)
        return null
      }
    }

    async function saveSupervisorCashCount(button) {
      const visitId = button?.dataset?.saveSupervisorCash
      const reportId = button?.dataset?.cashReportId
      const machineId = button?.dataset?.machineId
      if (!visitId || !machineId) return

      const cashInput = detailShell.querySelector(`[data-supervisor-cash="${CSS.escape(String(visitId))}"]`)
      const noteInput = detailShell.querySelector(`[data-supervisor-note="${CSS.escape(String(visitId))}"]`)
      const cashText = String(cashInput?.value || '').trim()
      const countedCash = cashText ? Number(cashText) : null

      if (cashText && !Number.isFinite(countedCash)) {
        setStatus('Reálně dovezená hotovost musí být číslo.', 'warning')
        return
      }

      const expectedCash = Number(button.dataset.expectedCash || 0)
      const expectedCard = Number(button.dataset.expectedCard || 0)
      const supervisorId = await getCurrentEmployeeId()
      const payload = {
        supervisor_counted_cash_czk: countedCash,
        supervisor_counted_by: supervisorId,
        supervisor_counted_at: new Date().toISOString(),
        note: String(noteInput?.value || '').trim() || null,
      }

      try {
        let result
        if (reportId) {
          result = await supabase
            .from('route_machine_cash_reports')
            .update(payload)
            .eq('id', Number(reportId))
        } else {
          result = await supabase
            .from('route_machine_cash_reports')
            .insert([{
              ...payload,
              visit_id: Number(visitId),
              machine_id: Number(machineId),
              expected_cash_czk: expectedCash,
              expected_card_czk: expectedCard,
              expected_total_czk: expectedCash + expectedCard,
            }])
        }

        if (result.error) throw result.error
        setStatus('Přepočet hotovosti je uložený.', 'success')
        await loadMobileRouteExecution(state.plan?.id)
        renderDetail()
      } catch (error) {
        console.error(error)
        setStatus(`Nepodařilo se uložit přepočet hotovosti: ${error.message || error}`, 'error')
      }
    }

    async function loadPlan() {
      if (!routeId) {
        state.plan = null
        state.cashReports = []
        state.mobileVisits = []
        state.routeVehicleLog = null
        return
      }

      const numericId = Number(routeId)
      if (Number.isFinite(numericId) && String(numericId) === String(routeId)) {
        const { data, error } = await supabase
          .from('route_plans')
          .select('id, planning_date, title, vehicle_id, planned_employee_id, optimization_provider, provider_status, execution_status, assigned_at, started_at, completed_at, stop_count, estimated_distance_km, estimated_drive_minutes, estimated_service_minutes, route_payload, return_to_start, start_latitude, start_longitude, warehouse_id, created_at, route_plan_stops(id, location_id, machine_id, stop_order, status, arrived_at, completed_at, skipped_at, title, address_snapshot, city_snapshot, latitude, longitude, priority_snapshot, service_window_snapshot, estimated_service_minutes, note)')
          .eq('id', numericId)
          .maybeSingle()

        if (!error && data) {
          state.plan = buildPlan(data)
          await Promise.all([
            loadCashReports(data.id),
            loadMobileRouteExecution(data.id),
            loadRouteVehicleLog(state.plan),
          ])
          return
        }

        if (error && !String(error.message || '').includes('route_plans')) {
          throw error
        }
      }

      const localPlans = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]')
      const localPlan = localPlans.find((item) => getPlanKey(item) === routeId)
      state.plan = localPlan ? buildPlan(localPlan) : null
      state.cashReports = []
      state.mobileVisits = []
      state.routeVehicleLog = null
    }

    async function updateRouteStatus(nextStatus) {
      if (!state.plan) return
      const routeKey = getPlanKey(state.plan)
      const nowIso = new Date().toISOString()

      const confirmed = window.confirm(
        nextStatus === 'done'
          ? 'Opravdu chceš označit trasu jako hotovou?'
          : 'Opravdu chceš trasu zrušit?'
      )
      if (!confirmed) return

      try {
        if (Number.isFinite(Number(state.plan.id))) {
          const patch = {
            execution_status: nextStatus,
            completed_at: nowIso,
          }

          const { error } = await supabase
            .from('route_plans')
            .update(patch)
            .eq('id', state.plan.id)

          if (error) throw error
        } else {
          const localPlans = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]')
          const updated = localPlans.map((item) => {
            if (getPlanKey(item) !== routeKey) return item
            return {
              ...item,
              execution_status: nextStatus,
              completed_at: nowIso,
            }
          })
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(updated))
        }

        setStatus(
          nextStatus === 'done' ? 'Trasa byla označena jako hotová.' : 'Trasa byla zrušena.',
          nextStatus === 'done' ? 'success' : 'warning'
        )
        await loadPlan()
        renderDetail()
      } catch (error) {
        console.error(error)
        setStatus(`Nepodařilo se uložit změnu trasy: ${error.message || error}`, 'error')
      }
    }

    async function initializePage() {
      try {
        await loadLookups()
        await loadPlan()
        if (state.plan) {
          statusLine.hidden = true
        } else {
          setStatus('Tahle trasa už tu není nebo nejde načíst.', 'warning')
        }
        renderDetail()
      } catch (error) {
        console.error(error)
        setStatus(`Nepodařilo se načíst detail trasy: ${error.message || error}`, 'error')
        renderDetail()
      }
    }

    initializePage()
  </script>
</body>
</html>
