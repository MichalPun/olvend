<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">OLVEND 1.10 – nová práce u kávových automatů</title>
  <desc id="desc">Informační leták k nové verzi mobilní aplikace OLVEND pro práci u kávových automatů.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#dde2e8"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121d2a"/>
      <stop offset="1" stop-color="#24364b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f04452"/>
      <stop offset="1" stop-color="#d60718"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#182230" flood-opacity=".16"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#101828" flood-opacity=".07"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#page)"/>
  <rect x="95" y="55" width="890" height="1240" rx="44" fill="#f5f7fa" filter="url(#shadow)"/>

  <g transform="translate(125 88)">
    <rect width="830" height="318" rx="34" fill="url(#head)"/>
    <circle cx="795" cy="292" r="180" fill="#e5091a" opacity=".17"/>
    <rect x="38" y="34" width="176" height="36" rx="18" fill="#e5091a" opacity=".18"/>
    <text x="126" y="58" text-anchor="middle" fill="#ffb7bd" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" letter-spacing="1.8">CO JE NOVÉHO</text>
    <text x="38" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.8">Nová práce u kávy</text>
    <text x="38" y="178" fill="#d3dbe5" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">OLVEND 1.10 není jen nový vzhled.</text>
    <text x="38" y="216" fill="#d3dbe5" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Příprava, doplnění, hotovost i kontrola jsou</text>
    <text x="38" y="251" fill="#d3dbe5" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">jednodušší a vedou tě krok za krokem.</text>
    <rect x="678" y="38" width="112" height="112" rx="30" fill="url(#red)"/>
    <text x="734" y="104" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900">1.10</text>
  </g>

  <text x="137" y="461" fill="#182230" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" letter-spacing="-.5">Co poznáš hned</text>
  <text x="137" y="493" fill="#667085" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Čtyři největší změny při obsluze kávového automatu</text>

  <g transform="translate(125 525)" font-family="Arial, Helvetica, sans-serif">
    <g filter="url(#cardShadow)">
      <rect width="830" height="128" rx="24" fill="#ffffff" stroke="#e3e8ef"/>
      <rect x="24" y="28" width="72" height="72" rx="20" fill="#eaf2ff"/>
      <text x="60" y="71" text-anchor="middle" fill="#175cd3" font-size="19" font-weight="900">01</text>
      <text x="120" y="52" fill="#182230" font-size="24" font-weight="900">Jasný postup krok za krokem</text>
      <text x="120" y="82" fill="#667085" font-size="17" font-weight="650">Pick-list, doplnění, hotovost a kontrola</text>
      <text x="120" y="105" fill="#667085" font-size="17" font-weight="650">na sebe přirozeně navazují.</text>
    </g>
    <g transform="translate(0 146)" filter="url(#cardShadow)">
      <rect width="830" height="128" rx="24" fill="#ffffff" stroke="#e3e8ef"/>
      <rect x="24" y="28" width="72" height="72" rx="20" fill="#e7f8ef"/>
      <text x="60" y="71" text-anchor="middle" fill="#087747" font-size="19" font-weight="900">02</text>
      <text x="120" y="52" fill="#182230" font-size="24" font-weight="900">Každá zásoba samostatně</text>
      <text x="120" y="82" fill="#667085" font-size="17" font-weight="650">Upravíš skutečný počet, přeskočení i něco navíc.</text>
      <text x="120" y="105" fill="#667085" font-size="17" font-weight="650">Nic se neslije do jedné nejasné položky.</text>
    </g>
    <g transform="translate(0 292)" filter="url(#cardShadow)">
      <rect width="830" height="128" rx="24" fill="#ffffff" stroke="#e3e8ef"/>
      <rect x="24" y="28" width="72" height="72" rx="20" fill="#fff3d8"/>
      <text x="60" y="71" text-anchor="middle" fill="#9a5a17" font-size="19" font-weight="900">03</text>
      <text x="120" y="52" fill="#182230" font-size="24" font-weight="900">Kelímky počítáš po tyčích</text>
      <text x="120" y="82" fill="#667085" font-size="17" font-weight="650">Kelímky vidíš v tyčích, víčka dál po kusech.</text>
      <text x="120" y="105" fill="#667085" font-size="17" font-weight="650">Skladová evidence přitom zůstává přesná.</text>
    </g>
    <g transform="translate(0 438)" filter="url(#cardShadow)">
      <rect width="830" height="128" rx="24" fill="#ffffff" stroke="#e3e8ef"/>
      <rect x="24" y="28" width="72" height="72" rx="20" fill="#ffe8ea"/>
      <text x="60" y="71" text-anchor="middle" fill="#c90d1c" font-size="19" font-weight="900">04</text>
      <text x="120" y="52" fill="#182230" font-size="24" font-weight="900">Rozhoduje skutečnost u automatu</text>
      <text x="120" y="82" fill="#667085" font-size="17" font-weight="650">Kontrolu uděláš i při nulovém návrhu a doplníš</text>
      <text x="120" y="105" fill="#667085" font-size="17" font-weight="650">to, co na místě opravdu chybí.</text>
    </g>
  </g>

  <g transform="translate(125 1122)">
    <rect width="830" height="108" rx="24" fill="#fff1f2" stroke="#ffd2d6"/>
    <circle cx="54" cy="54" r="27" fill="#e5091a"/>
    <path d="M43 54h21m-8-9 9 9-9 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="46" fill="#c90d1c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900">Teď kávové automaty. Další části budou následovat.</text>
    <text x="98" y="75" fill="#8f2b34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Stejným směrem budeme postupně převádět i zbytek mobilní aplikace.</text>
  </g>

  <text x="540" y="1272" text-anchor="middle" fill="#7b8494" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">OLVEND · MOBILNÍ APLIKACE · ŘÍJEN 2026</text>
</svg>
