name: Security boundary regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-vm-modules scripts/test_security_boundary.mjs
      - run: node scripts/check_anonymous_boundary.mjs --self-test
      - run: node scripts/check_anonymous_boundary.mjs --live
